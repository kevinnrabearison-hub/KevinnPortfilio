services:
  - type: web_service
    name: portfolio-backend
    env: node
    region: oregon
    plan: free
    branch: main
    root: backend
    buildCommand: npm install
    startCommand: npm start

  - type: static_site
    name: portfolio-frontend
    region: oregon
    plan: free
    branch: main
    root: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
